<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #ffffff; --surface: #ffffff; --text: #202124; --muted: #5f6368;
  --line: #e0e0e0; --accent: #fbbc04; --hover: #f1f3f4; --danger: #c5221f;
  --shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #202124; --surface: #202124; --text: #e8eaed; --muted: #9aa0a6;
    --line: #5f6368; --hover: #3c4043; --danger: #f28b82;
    --shadow: 0 1px 2px rgba(0,0,0,.6), 0 2px 6px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #202124; --surface: #202124; --text: #e8eaed; --muted: #9aa0a6;
  --line: #5f6368; --hover: #3c4043; --danger: #f28b82;
  --shadow: 0 1px 2px rgba(0,0,0,.6), 0 2px 6px 2px rgba(0,0,0,.4);
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; background: var(--bg); color: var(--text); font-family: "Roboto", "Segoe UI", system-ui, sans-serif; font-size: 16px; line-height: 1.45; }
main { max-width: 960px; margin: 0 auto; padding: 16px 16px 48px; }
button { font: inherit; cursor: pointer; color: inherit; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
h1 { font-size: 1.4rem; font-weight: 500; margin: 0; }
.btn { padding: 8px 14px; border: 0; border-radius: 18px; background: none; color: var(--muted); }
.btn:hover { background: var(--hover); }
#count { margin: 0 0 12px; color: var(--muted); font-size: .9rem; min-height: 1.3em; text-align: center; }
.add { display: flex; align-items: center; gap: 4px; max-width: 600px; margin: 8px auto 6px; padding: 6px 8px 6px 16px; background: var(--surface); border-radius: 8px; box-shadow: var(--shadow); }
.add input[type=text] { flex: 1; min-width: 0; font: inherit; padding: 10px 0; border: 0; background: none; color: var(--text); }
.add input[type=text]:focus { outline: none; }
.add input::placeholder { color: var(--muted); }
.primary { padding: 8px 16px; border: 0; border-radius: 4px; background: none; font-weight: 500; }
.primary:hover { background: var(--hover); }
#preview { display: none; align-items: center; gap: 10px; max-width: 600px; margin: 8px auto; }
#preview img { height: 64px; border-radius: 8px; border: 1px solid var(--line); }
.hint { margin: 0 auto 20px; max-width: 600px; text-align: center; color: var(--muted); font-size: .8rem; }
.bar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.tabs, .views { display: flex; gap: 4px; flex-wrap: wrap; }
.tab, .view { padding: 8px 16px; border: 0; background: none; border-radius: 20px; color: var(--muted); }
.tab:hover, .view:hover { background: var(--hover); }
.tab[aria-selected=true], .view[aria-pressed=true] { background: rgba(251,188,4,.28); color: var(--text); font-weight: 500; }
.sec { margin: 20px 4px 8px; font-size: .75rem; font-weight: 500; letter-spacing: .08em; color: var(--muted); }
ul { list-style: none; margin: 0; padding: 0; }
ul.notes.grid { column-width: 230px; column-gap: 14px; }
ul.notes.list { max-width: 600px; margin: 0 auto; }
li.note { position: relative; break-inside: avoid; margin: 0 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; transition: box-shadow .15s; }
li.note:hover, li.note:focus-within { box-shadow: var(--shadow); }
.thumb { display: block; width: 100%; max-height: 260px; object-fit: cover; cursor: zoom-in; }
.body { display: flex; align-items: flex-start; gap: 10px; padding: 12px 44px 8px 14px; }
li.note.nopin .body { padding-right: 14px; }
.body input[type=checkbox] { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--muted); flex-shrink: 0; cursor: pointer; }
.txt { flex: 1; overflow-wrap: anywhere; font-size: 1.05rem; }
li.done .txt { text-decoration: line-through; color: var(--muted); }
.pin { position: absolute; top: 6px; right: 6px; width: 34px; height: 34px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--surface); color: var(--muted); opacity: .55; }
.pin svg { width: 20px; height: 20px; fill: currentColor; transition: transform .15s; }
.pin:hover { background: var(--hover); opacity: 1; }
.pin[aria-pressed=true] { color: var(--text); opacity: 1; }
.pin[aria-pressed=true] svg { transform: rotate(-30deg); }
.acts { display: flex; gap: 2px; flex-wrap: wrap; padding: 2px 8px 8px; opacity: 0; transition: opacity .15s; }
li.note:hover .acts, li.note:focus-within .acts { opacity: 1; }
@media (hover: none) { .acts { opacity: 1; } }
.acts button { border: 0; background: none; padding: 6px 10px; border-radius: 16px; font-size: .85rem; color: var(--muted); }
.acts .del { color: var(--danger); }
.acts button:hover { background: var(--hover); }
.empty { padding: 48px 14px; text-align: center; color: var(--muted); }
.clear { display: block; margin: 12px auto 0; border: 0; background: none; color: var(--muted); text-decoration: underline; padding: 6px 0; }
#lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5; cursor: zoom-out; }
#lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>My Notes</h1>
    <button id="refreshBtn" class="btn" type="button">Refresh</button>
  </div>
  <p id="count" aria-live="polite"></p>

  <div class="add">
    <input id="newTask" type="text" placeholder="Take a note…" aria-label="New task" maxlength="200">
    <button id="photoBtn" class="btn" type="button">Add photo</button>
    <button id="addBtn" class="primary" type="button">Add</button>
    <input id="file" type="file" accept="image/*" hidden>
  </div>
  <div id="preview"><img id="previewImg" alt="Photo to attach"><button id="removePhoto" class="btn" type="button">Remove photo</button></div>
  <p class="hint">Tip: copy a picture, click in the box above, and paste it with Ctrl+V (Cmd+V on Mac).</p>

  <div class="bar">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="active" type="button"></button>
      <button class="tab" role="tab" data-tab="archive" type="button"></button>
      <button class="tab" role="tab" data-tab="bin" type="button"></button>
    </div>
    <div class="views">
      <button class="view" data-view="list" type="button">List</button>
      <button class="view" data-view="grid" type="button">Grid</button>
    </div>
  </div>

  <div id="board"></div>
  <button id="clearBtn" class="clear" type="button" hidden></button>
</main>
<div id="lightbox"><img id="bigImg" alt="Full size photo"></div>

<script>
var tasks = [], tab = "active", view = "grid", pending = "";
try { tasks = JSON.parse(localStorage.getItem("simple-todo") || "[]") || []; } catch (e) { tasks = []; }
try { view = localStorage.getItem("simple-todo-view") || "grid"; } catch (e) {}
tasks.forEach(function (t, i) { if (!t.status) t.status = "active"; if (!t.id) t.id = Date.now() + i; });

var $ = function (id) { return document.getElementById(id); };
var board = $("board"), input = $("newTask"), countEl = $("count"), clearBtn = $("clearBtn");
var names = { active: "Notes", archive: "Archive", bin: "Bin" };
var PIN = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 9V4h1c.55 0 1-.45 1-1s-.45-1-1-1H7c-.55 0-1 .45-1 1s.45 1 1 1h1v5c0 1.66-1.34 3-3 3v2h5.97v7l1 1 1-1v-7H19v-2c-1.66 0-3-1.34-3-3z"/></svg>';

function save() {
  try { localStorage.setItem("simple-todo", JSON.stringify(tasks)); return true; }
  catch (e) { countEl.textContent = "Could not save. Storage is full: try deleting some photos."; return false; }
}
function inTab(n) { return tasks.filter(function (t) { return t.status === n; }); }
function setStatus(t, s) { t.status = s; if (s !== "active") t.pinned = false; save(); render(); }
function btn(label, cls, fn) {
  var b = document.createElement("button");
  b.type = "button"; b.textContent = label; if (cls) b.className = cls; b.onclick = fn; return b;
}

function card(t) {
  var li = document.createElement("li");
  li.className = "note" + (t.done ? " done" : "") + (tab === "active" ? "" : " nopin");
  if (t.img) {
    var im = document.createElement("img");
    im.className = "thumb"; im.src = t.img; im.alt = "Photo for: " + t.text;
    im.onclick = function () { $("bigImg").src = t.img; $("lightbox").style.display = "flex"; };
    li.appendChild(im);
  }
  var body = document.createElement("div"); body.className = "body";
  if (tab === "active") {
    var box = document.createElement("input");
    box.type = "checkbox"; box.checked = !!t.done;
    box.setAttribute("aria-label", "Mark done: " + t.text);
    box.onchange = function () { t.done = box.checked; save(); render(); };
    body.appendChild(box);
  }
  var label = document.createElement("span"); label.className = "txt"; label.textContent = t.text;
  body.appendChild(label); li.appendChild(body);
  if (tab === "active") {
    var p = document.createElement("button");
    p.type = "button"; p.className = "pin"; p.innerHTML = PIN;
    p.setAttribute("aria-pressed", !!t.pinned);
    p.setAttribute("aria-label", t.pinned ? "Unpin note" : "Pin note");
    p.title = t.pinned ? "Unpin note" : "Pin note";
    p.onclick = function () { t.pinned = !t.pinned; save(); render(); };
    li.appendChild(p);
  }
  var acts = document.createElement("div"); acts.className = "acts";
  if (tab === "active") {
    acts.appendChild(btn("Archive", "", function () { setStatus(t, "archive"); }));
    acts.appendChild(btn("Delete", "del", function () { setStatus(t, "bin"); }));
  } else {
    acts.appendChild(btn("Restore", "", function () { setStatus(t, "active"); }));
    acts.appendChild(btn(tab === "bin" ? "Delete forever" : "Delete", "del", function () {
      if (tab === "archive") setStatus(t, "bin");
      else { tasks = tasks.filter(function (x) { return x !== t; }); save(); render(); }
    }));
  }
  li.appendChild(acts);
  return li;
}

function section(label, arr) {
  if (!arr.length) return;
  if (label) { var h = document.createElement("h2"); h.className = "sec"; h.textContent = label; board.appendChild(h); }
  var ul = document.createElement("ul"); ul.className = "notes " + view;
  arr.forEach(function (t) { ul.appendChild(card(t)); });
  board.appendChild(ul);
}

function render() {
  board.innerHTML = "";
  document.querySelectorAll(".tab").forEach(function (b) {
    var n = b.getAttribute("data-tab");
    b.textContent = names[n] + " (" + inTab(n).length + ")";
    b.setAttribute("aria-selected", n === tab);
  });
  document.querySelectorAll(".view").forEach(function (b) {
    b.setAttribute("aria-pressed", b.getAttribute("data-view") === view);
  });
  var items = inTab(tab);
  if (!items.length) {
    var e = document.createElement("div"); e.className = "empty";
    e.textContent = tab === "active" ? "Notes you add appear here. Type one above and press Add."
      : tab === "archive" ? "Nothing archived yet." : "The bin is empty.";
    board.appendChild(e);
  } else if (tab === "active") {
    var pinned = items.filter(function (t) { return t.pinned; });
    var others = items.filter(function (t) { return !t.pinned; });
    section(pinned.length ? "PINNED" : "", pinned);
    section(pinned.length ? "OTHERS" : "", others);
  } else section("", items);

  var act = inTab("active"), open = act.filter(function (t) { return !t.done; }).length;
  if (tab !== "active") countEl.textContent = tab === "bin" ? "Items here can be restored or deleted forever." : "";
  else countEl.textContent = !act.length ? "" : open === 0 ? "All done. Nice work!" : open + (open === 1 ? " task left" : " tasks left");

  var showClear = (tab === "active" && act.some(function (t) { return t.done; })) || (tab === "bin" && items.length);
  clearBtn.hidden = !showClear;
  clearBtn.textContent = tab === "bin" ? "Empty bin" : "Archive finished tasks";
}

function setPending(url) {
  pending = url || "";
  $("preview").style.display = pending ? "flex" : "none";
  $("previewImg").src = pending;
}

function handleImage(file) {
  if (!file || file.type.indexOf("image/") !== 0) return;
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      var max = 600, s = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement("canvas");
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      setPending(c.toDataURL("image/jpeg", 0.7));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function addTask() {
  var text = input.value.trim();
  if (!text && !pending) { input.focus(); return; }
  tasks.unshift({ id: Date.now(), text: text || "Photo", done: false, img: pending, status: "active", pinned: false });
  input.value = ""; setPending("");
  tab = "active"; save(); render(); input.focus();
}

document.addEventListener("paste", function (e) {
  var items = (e.clipboardData && e.clipboardData.items) || [];
  for (var i = 0; i < items.length; i++) {
    if (items[i].type.indexOf("image/") === 0) { handleImage(items[i].getAsFile()); e.preventDefault(); break; }
  }
});
$("photoBtn").onclick = function () { $("file").click(); };
$("file").onchange = function () { handleImage(this.files[0]); this.value = ""; };
$("removePhoto").onclick = function () { setPending(""); };
$("addBtn").onclick = addTask;
input.addEventListener("keydown", function (e) { if (e.key === "Enter") addTask(); });

document.querySelectorAll(".tab").forEach(function (b) {
  b.onclick = function () { tab = b.getAttribute("data-tab"); render(); };
});
document.querySelectorAll(".view").forEach(function (b) {
  b.onclick = function () {
    view = b.getAttribute("data-view");
    try { localStorage.setItem("simple-todo-view", view); } catch (e) {}
    render();
  };
});
clearBtn.onclick = function () {
  if (tab === "bin") tasks = tasks.filter(function (t) { return t.status !== "bin"; });
  else tasks.forEach(function (t) { if (t.status === "active" && t.done) { t.status = "archive"; t.pinned = false; } });
  save(); render();
};
$("refreshBtn").onclick = function () {
  try { tasks = JSON.parse(localStorage.getItem("simple-todo") || "[]") || []; } catch (e) {}
  render();
  countEl.textContent = "Refreshed";
  setTimeout(render, 1200);
};
$("lightbox").onclick = function () { this.style.display = "none"; };
render();
</script>
</body>
</html>
